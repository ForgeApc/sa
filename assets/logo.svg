<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Polluted Hub">
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d2350"/>
      <stop offset="0.55" stop-color="#071129"/>
      <stop offset="1" stop-color="#02040c"/>
    </linearGradient>

    <radialGradient id="ph-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4d9bff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ph-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d5e6ff"/>
      <stop offset="1" stop-color="#5f9dfb"/>
    </linearGradient>

    <linearGradient id="ph-bone" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfeafc"/>
      <stop offset="1" stop-color="#93adcf"/>
    </linearGradient>

    <linearGradient id="ph-wisp" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e8f1ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8fbcff" stop-opacity="0"/>
    </linearGradient>

    <filter id="ph-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="ph-neon" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="ph-clip"><rect x="0" y="0" width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#ph-clip)">
    <rect width="512" height="512" fill="url(#ph-bg)"/>

    <!-- perspective grid floor -->
    <g stroke="#4d9bff" stroke-opacity="0.18" stroke-width="1.6">
      <path d="M-60 400 H572 M-60 436 H572 M-60 478 H572"/>
      <path d="M256 366 L-140 512 M256 366 L48 512 M256 366 L176 512
               M256 366 L336 512 M256 366 L464 512 M256 366 L652 512"/>
    </g>

    <rect width="512" height="512" fill="url(#ph-glow)"/>

    <!-- spirit wisps flanking the skull -->
    <g filter="url(#ph-soft)" opacity="0.75">
      <path d="M78 92 C34 152 30 244 62 322 C74 352 76 388 66 418
               C104 386 122 330 120 274 C118 212 104 148 118 98 Z" fill="url(#ph-wisp)"/>
      <path d="M434 92 C478 152 482 244 450 322 C438 352 436 388 446 418
               C408 386 390 330 392 274 C394 212 408 148 394 98 Z" fill="url(#ph-wisp)"/>
    </g>

    <!-- chains, top corners -->
    <g stroke="#9fc4ff" stroke-opacity="0.3" stroke-width="6.5" fill="none">
      <ellipse cx="60" cy="34" rx="13" ry="21"/>
      <ellipse cx="60" cy="72" rx="13" ry="21"/>
      <ellipse cx="452" cy="34" rx="13" ry="21"/>
      <ellipse cx="452" cy="72" rx="13" ry="21"/>
    </g>

    <!-- skull -->
    <g transform="translate(256 196)">
      <path d="M0-96 C-54-96 -96-56 -96-4 C-96 27 -81 54 -58 73
               L-58 100 C-58 117 -46 127 -29 127 L29 127
               C46 127 58 117 58 100 L58 73
               C81 54 96 27 96-4 C96-56 54-96 0-96 Z"
            fill="url(#ph-bone)"/>
      <path d="M-58-23 C-58-46 -39-59 -22-50 C-10-44 -12-16 -27-6 C-44 7 -58-1 -58-23 Z" fill="#050b18"/>
      <path d="M58-23 C58-46 39-59 22-50 C10-44 12-16 27-6 C44 7 58-1 58-23 Z" fill="#050b18"/>
      <circle cx="-33" cy="-27" r="8.5" fill="#5dabff" filter="url(#ph-neon)"/>
      <circle cx="33" cy="-27" r="8.5" fill="#5dabff" filter="url(#ph-neon)"/>
      <path d="M0 8 L-16 42 L0 50 L16 42 Z" fill="#050b18"/>
      <g fill="#050b18">
        <rect x="-39" y="76" width="14" height="30" rx="4"/>
        <rect x="-20" y="76" width="14" height="35" rx="4"/>
        <rect x="1" y="76" width="14" height="35" rx="4"/>
        <rect x="22" y="76" width="14" height="30" rx="4"/>
      </g>
    </g>

    <!-- wordmark, width-locked so it never overflows the tile -->
    <g font-family="'Arial Black','Archivo Black',Impact,sans-serif" font-weight="900"
       text-anchor="middle" font-size="86">
      <text x="256" y="408" textLength="404" lengthAdjust="spacingAndGlyphs"
            fill="#2f7ae0" opacity="0.6" filter="url(#ph-soft)">POLLUTED</text>
      <text x="256" y="404" textLength="404" lengthAdjust="spacingAndGlyphs"
            fill="url(#ph-word)">POLLUTED</text>
    </g>

    <!-- drips -->
    <g fill="#8fbcff" opacity="0.5">
      <path d="M96 410 h12 v28 a6 6 0 0 1-12 0 Z"/>
      <path d="M188 410 h10 v44 a5 5 0 0 1-10 0 Z"/>
      <path d="M292 410 h11 v22 a5.5 5.5 0 0 1-11 0 Z"/>
      <path d="M382 410 h9 v36 a4.5 4.5 0 0 1-9 0 Z"/>
    </g>

    <rect x="3" y="3" width="506" height="506" rx="93" fill="none"
          stroke="#7fb2ff" stroke-opacity="0.3" stroke-width="6"/>
  </g>
</svg>
